openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Statutory Probate Courts Dallas County CMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cases
    description: Probate case operations
  - name: parties
    description: Party operations
  - name: hearings
    description: Hearing operations
  - name: fees
    description: Fee operations
  - name: notices
    description: Notice operations
  - name: documents
    description: Document operations
  - name: dashboard
    description: Dashboard summary operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List/search cases
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: searchType
          in: query
          schema:
            type: string
            enum: [caseNumber, fileNumber, partyName]
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get case by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /parties:
    post:
      operationId: createParty
      tags: [parties]
      summary: Add a party to a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: Created party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
    get:
      operationId: listParties
      tags: [parties]
      summary: List all parties
      parameters:
        - name: caseId
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"

  /hearings:
    post:
      operationId: createHearing
      tags: [hearings]
      summary: Add a new hearing to a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HearingInput"
      responses:
        "201":
          description: Created hearing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hearing"
    get:
      operationId: listHearings
      tags: [hearings]
      summary: List hearings
      parameters:
        - name: caseId
          in: query
          schema:
            type: integer
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of hearings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hearing"

  /fees:
    post:
      operationId: createFee
      tags: [fees]
      summary: Record a new fee for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeInput"
      responses:
        "201":
          description: Created fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fee"
    get:
      operationId: listFees
      tags: [fees]
      summary: List fees
      parameters:
        - name: caseId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, pending, waived]
      responses:
        "200":
          description: List of fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fee"

  /notices:
    post:
      operationId: createNotice
      tags: [notices]
      summary: Issue a new notice for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeInput"
      responses:
        "201":
          description: Created notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
    get:
      operationId: listNotices
      tags: [notices]
      summary: List notices
      parameters:
        - name: caseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"

  /documents:
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add a document record for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - name: caseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /activity:
    post:
      operationId: createActivity
      tags: [dashboard]
      summary: Log an activity entry for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityItem"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent case activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/upcoming-hearings:
    get:
      operationId: getUpcomingHearings
      tags: [dashboard]
      summary: Get upcoming hearings (next 7 days)
      responses:
        "200":
          description: Upcoming hearings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hearing"

  /dashboard/pending-fees:
    get:
      operationId: getPendingFees
      tags: [dashboard]
      summary: Get all pending fees summary
      responses:
        "200":
          description: Pending fees summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingFeesSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Case:
      type: object
      required: [id, caseNumber, fileNumber, title, caseType, courtName, presidingOfficer, caseCategory, filingDate, status, stage]
      properties:
        id:
          type: integer
        caseNumber:
          type: string
        fileNumber:
          type: string
        title:
          type: string
        caseType:
          type: string
        courtName:
          type: string
        presidingOfficer:
          type: string
        caseCategory:
          type: string
        filingDate:
          type: string
        status:
          type: string
          enum: [Active, Closed, Pending]
        stage:
          type: string
        lastCourtDate:
          type: ["string", "null"]
        nextCourtDate:
          type: ["string", "null"]
        lastPaidFee:
          type: ["number", "null"]
        lastPaidFeeDate:
          type: ["string", "null"]
        pendingFees:
          type: number
        lastNotice:
          type: ["string", "null"]

    CaseDetail:
      type: object
      required: [id, caseNumber, fileNumber, title, caseType, courtName, presidingOfficer, caseCategory, filingDate, status, stage, parties, hearings, fees, notices, documents]
      properties:
        id:
          type: integer
        caseNumber:
          type: string
        fileNumber:
          type: string
        title:
          type: string
        caseType:
          type: string
        courtName:
          type: string
        presidingOfficer:
          type: string
        caseCategory:
          type: string
        filingDate:
          type: string
        status:
          type: string
          enum: [Active, Closed, Pending]
        stage:
          type: string
        lastCourtDate:
          type: ["string", "null"]
        nextCourtDate:
          type: ["string", "null"]
        lastPaidFee:
          type: ["number", "null"]
        lastPaidFeeDate:
          type: ["string", "null"]
        pendingFees:
          type: number
        lastNotice:
          type: ["string", "null"]
        parties:
          type: array
          items:
            $ref: "#/components/schemas/Party"
        hearings:
          type: array
          items:
            $ref: "#/components/schemas/Hearing"
        fees:
          type: array
          items:
            $ref: "#/components/schemas/Fee"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"

    CaseListResponse:
      type: object
      required: [cases, total, page, pageSize]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CaseInput:
      type: object
      required: [caseNumber, fileNumber, title, caseType, courtName, presidingOfficer, caseCategory, filingDate, status, stage]
      properties:
        caseNumber:
          type: string
        fileNumber:
          type: string
        title:
          type: string
        caseType:
          type: string
        courtName:
          type: string
        presidingOfficer:
          type: string
        caseCategory:
          type: string
        filingDate:
          type: string
        status:
          type: string
          enum: [Active, Closed, Pending]
        stage:
          type: string

    CaseUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [Active, Closed, Pending]
        stage:
          type: string
        nextCourtDate:
          type: ["string", "null"]
        presidingOfficer:
          type: string

    Party:
      type: object
      required: [id, caseId, name, role, advocate]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [Petitioner, Respondent, Beneficiary, Executor, Guardian, Creditor, Other]
        advocate:
          type: string
        contactInfo:
          type: ["string", "null"]

    Hearing:
      type: object
      required: [id, caseId, caseNumber, caseTitle, hearingDate, hearingType, courtRoom, result]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        caseNumber:
          type: string
        caseTitle:
          type: string
        hearingDate:
          type: string
        hearingType:
          type: string
        courtRoom:
          type: string
        result:
          type: string
        notes:
          type: ["string", "null"]

    Fee:
      type: object
      required: [id, caseId, description, amount, status, dueDate]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        description:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [paid, pending, waived]
        dueDate:
          type: string
        paidDate:
          type: ["string", "null"]
        receiptNumber:
          type: ["string", "null"]

    Notice:
      type: object
      required: [id, caseId, title, issuedDate, noticeType, issuedBy]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        issuedDate:
          type: string
        noticeType:
          type: string
        issuedBy:
          type: string
        content:
          type: ["string", "null"]

    Document:
      type: object
      required: [id, caseId, fileName, fileType, uploadedBy, uploadedDate, category]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        fileName:
          type: string
        fileType:
          type: string
        uploadedBy:
          type: string
        uploadedDate:
          type: string
        category:
          type: string
        sizeKb:
          type: integer

    DashboardSummary:
      type: object
      required: [totalCases, activeCases, pendingCases, closedCases, totalPendingFees, upcomingHearingsCount, recentFilingsCount]
      properties:
        totalCases:
          type: integer
        activeCases:
          type: integer
        pendingCases:
          type: integer
        closedCases:
          type: integer
        totalPendingFees:
          type: number
        upcomingHearingsCount:
          type: integer
        recentFilingsCount:
          type: integer
        statusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
        count:
          type: integer

    ActivityItem:
      type: object
      required: [id, caseId, caseNumber, action, timestamp, user]
      properties:
        id:
          type: integer
        caseId:
          type: integer
        caseNumber:
          type: string
        action:
          type: string
        timestamp:
          type: string
        user:
          type: string
        details:
          type: ["string", "null"]

    PendingFeesSummary:
      type: object
      required: [totalAmount, casesWithPendingFees, fees]
      properties:
        totalAmount:
          type: number
        casesWithPendingFees:
          type: integer
        fees:
          type: array
          items:
            $ref: "#/components/schemas/Fee"

    PartyInput:
      type: object
      required: [caseId, name, role, advocate]
      properties:
        caseId:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [Petitioner, Respondent, Beneficiary, Executor, Guardian, Creditor, Other]
        advocate:
          type: string
        contactInfo:
          type: ["string", "null"]

    HearingInput:
      type: object
      required: [caseId, caseNumber, caseTitle, hearingDate, hearingType, courtRoom, result]
      properties:
        caseId:
          type: integer
        caseNumber:
          type: string
        caseTitle:
          type: string
        hearingDate:
          type: string
        hearingType:
          type: string
        courtRoom:
          type: string
        result:
          type: string
        notes:
          type: ["string", "null"]

    FeeInput:
      type: object
      required: [caseId, description, amount, status, dueDate]
      properties:
        caseId:
          type: integer
        description:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [paid, pending, waived]
        dueDate:
          type: string
        paidDate:
          type: ["string", "null"]
        receiptNumber:
          type: ["string", "null"]

    NoticeInput:
      type: object
      required: [caseId, title, issuedDate, noticeType, issuedBy]
      properties:
        caseId:
          type: integer
        title:
          type: string
        issuedDate:
          type: string
        noticeType:
          type: string
        issuedBy:
          type: string
        content:
          type: ["string", "null"]

    DocumentInput:
      type: object
      required: [caseId, fileName, fileType, uploadedBy, uploadedDate, category, sizeKb]
      properties:
        caseId:
          type: integer
        fileName:
          type: string
        fileType:
          type: string
        uploadedBy:
          type: string
        uploadedDate:
          type: string
        category:
          type: string
        sizeKb:
          type: integer

    ActivityInput:
      type: object
      required: [caseId, caseNumber, action, user]
      properties:
        caseId:
          type: integer
        caseNumber:
          type: string
        action:
          type: string
        user:
          type: string
        details:
          type: ["string", "null"]
